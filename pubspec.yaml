name: korie
description: "Korie: a launcher for TV, car, phone and desktop."
publish_to: 'none'
version: 2.11.0+31

environment:
  sdk: ^3.14.0

dependencies:
  archive: ^4.7.1
  flutter:
    sdk: flutter
  just_audio: ^0.10.6
  lua_dart: ^1.0.0
  material_ui: ^1.1.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Inter-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
