# Builds Korie and publishes it as a GitHub release whenever the VERSION file changes on main,
# then points update.json at it, so Korie (and Korie 1.8) offers the update.
# The signing key is the repository secret KORIE_KEYSTORE_B64 (the keystore file, base64): the
# same key as every earlier Korie, so the new version installs over the old one.
name: Release
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
      - name: Signing key
        env:
          KEY: ${{ secrets.KORIE_KEYSTORE_B64 }}
        run: |
          [ -n "$KEY" ] || { echo "Add the repository secret KORIE_KEYSTORE_B64 first." >&2; exit 1; }
          echo "$KEY" | base64 -d > android/korie.keystore
      - name: Build
        run: |
          V=$(sed -n 1p VERSION)
          CODE=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          flutter pub get
          flutter build apk --release --build-name "$V" --build-number "$CODE"
          cp build/app/outputs/flutter-apk/app-release.apk korie.apk
          # The APK must carry the same signature as earlier releases.
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$SIGNER" verify --print-certs korie.apk | grep -q "3f00d6ac843d9ef05a46f0526aaffa4e64d682f1966ef44c723648fa4348ea47" \
            || { echo "korie.apk is not signed with Korie's key" >&2; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"
          echo "CODE=$CODE" >> "$GITHUB_ENV"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$V" korie.apk --title "Korie $V" --notes "Korie $V"
      - name: Offer the update
        run: |
          printf '{\n  "version": "%s",\n  "code": %s,\n  "apk": "https://github.com/%s/releases/download/v%s/korie.apk"\n}\n' "$V" "$CODE" "$GITHUB_REPOSITORY" "$V" > update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "update.json: Korie $V"
          git push
