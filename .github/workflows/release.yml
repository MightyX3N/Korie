# Builds every Korie app when a version tag is pushed (git tag v0.7.0 && git push --tags)
# and publishes them as a GitHub release. The file names never change, so
# https://github.com/MightyX3N/Korie/releases/latest/download/<name> always gives the newest:
#   Korie-AndroidTV.apk  Korie-Windows-Setup.exe  Korie-Mac.dmg
#   Korie-Linux.AppImage  Korie-Linux.deb
# The server image (ghcr.io/mightyx3n/korie:<version>) is built by docker.yml for the same tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.6.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Version
        run: |
          V="${TAG#v}"
          IFS=. read -r MA MI PA <<< "${V%%-*}"
          echo "KORIE_VERSION=$V" >> "$GITHUB_ENV"
          echo "KORIE_VERSION_CODE=$((MA * 10000 + MI * 100 + PA))" >> "$GITHUB_ENV"
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASS" ]; then
            echo "::error::Add the ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/korie.keystore"
          echo "KORIE_KEYSTORE=$RUNNER_TEMP/korie.keystore" >> "$GITHUB_ENV"
          echo "KORIE_KEYSTORE_PASS=$PASS" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Korie-AndroidTV.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Korie-AndroidTV.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            args: ""
          - os: macos-latest
            bundles: dmg
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            bundles: deb,appimage
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Version
        shell: bash
        working-directory: desktop
        run: |
          V="${TAG#v}"
          node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(c,null,2))" "$V"
      - name: Build
        shell: bash
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.args }}
      - name: Collect
        shell: bash
        run: |
          B=desktop/src-tauri/target
          mkdir out
          case "$RUNNER_OS" in
            Windows) cp $B/release/bundle/nsis/*.exe out/Korie-Windows-Setup.exe ;;
            macOS)   cp $B/universal-apple-darwin/release/bundle/dmg/*.dmg out/Korie-Mac.dmg ;;
            Linux)   cp $B/release/bundle/deb/*.deb out/Korie-Linux.deb
                     cp $B/release/bundle/appimage/*.AppImage out/Korie-Linux.AppImage ;;
          esac
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: out/*

  release:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Notes
        run: |
          V="${TAG#v}"
          cat > notes.md <<EOF
          ## Korie $V

          **Server:** \`docker pull ghcr.io/mightyx3n/korie:$V\` (or \`:latest\`). See the [install guide](https://mightyx3n.github.io/Korie/#install).

          | App | File |
          | --- | --- |
          | Android TV | Korie-AndroidTV.apk |
          | Windows | Korie-Windows-Setup.exe |
          | Mac (Apple silicon and Intel) | Korie-Mac.dmg |
          | Linux | Korie-Linux.AppImage or Korie-Linux.deb |

          The Mac app isn't signed by Apple: the first time, right-click Korie in Applications and choose Open.
          EOF
          sed -i 's/^          //' notes.md
          ls -l files
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Korie ${{ env.TAG }}
          body_path: notes.md
          files: files/*
